spring.application.name=sprignai-elasticsearch-vector-demo
spring.ai.vectorstore.elasticsearch.initialize-schema=true
spring.ai.vectorstore.elasticsearch.index-name=spring-ai-pdf-index
spring.ai.vectorstore.elasticsearch.dimensions=768
spring.ai.vectorstore.elasticsearch.similarity=cosine
spring.elasticsearch.connection-timeout=1s
spring.elasticsearch.uris=http://localhost:9200
spring.elasticsearch.restclient.sniffer.delay-after-failure=1m
spring.elasticsearch.restclient.sniffer.interval=5m
spring.elasticsearch.socket-keep-alive=true
spring.elasticsearch.socket-timeout=10000
spring.elasticsearch.password=123456
spring.elasticsearch.username=elastic
# Ollama配置
spring.ai.openai.base-url=http://localhost:11434/v1
spring.ai.openai.api-key=ollama
spring.ai.openai.chat.options.model=phi3
spring.ai.ollama.embedding.model=nomic-embed-text
